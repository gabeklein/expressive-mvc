name: Major

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: major-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  major:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Major releases need the major label
        env:
          BASE: ${{ github.base_ref }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'major') }}
        run: bun .github/scripts/major-check.ts
