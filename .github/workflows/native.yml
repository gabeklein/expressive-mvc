name: Native

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - 'packages/*/package.json'
      - 'packages/*/tsdown.config.ts'
      - '.github/scripts/native-*'
      - '.github/workflows/native.yml'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - run: bun run build

      - name: Metro, Hermes and field semantics
        run: bun .github/scripts/native-check.ts

  simulator:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'native')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - run: bun run build

      - name: Boot an iOS simulator
        run: |
          xcrun simctl list devices available
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl list devices booted

      - name: Gauntlet on the iOS simulator
        run: bun .github/scripts/native-gauntlet.ts ios
