name: Typecheck cache

on:
  push:
    branches: [main]

concurrency:
  group: typecheck-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - uses: actions/cache@v5
        with:
          path: packages/*/tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-

      - run: bun run typecheck
