name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - run: bun run test

      - run: bun run build

      - name: Dist is consumable
        run: bun run dist

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Dist executes when installed
        run: bun run smoke

      - name: Bundle size
        continue-on-error: true
        run: bun run size

      - name: Docs agree with code
        run: bun run docs

      - name: Changeset reminder
        continue-on-error: true
        run: bunx changeset status --since origin/main

      - name: Pack validation
        continue-on-error: true
        run: |
          for pkg in mvc react router; do
            (cd packages/$pkg && npm publish --dry-run)
          done
