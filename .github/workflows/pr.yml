name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - run: bun run test

      - run: bun run build

      - name: Dist is consumable
        run: bun .github/scripts/dist-check.ts

      - name: Bundle size
        continue-on-error: true
        run: bun .github/scripts/size-limit.ts

      - name: Docs agree with code
        run: bun .github/scripts/docs-check.ts

      - name: Changeset reminder
        continue-on-error: true
        run: bunx changeset status --since origin/main

  dist-smoke:
    if: >-
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: dist-smoke-npm-${{ runner.os }}-${{ hashFiles('package.json', 'packages/*/package.json') }}
          restore-keys: dist-smoke-npm-${{ runner.os }}-

      - run: bun run build

      - name: Packed tarballs install and run
        run: bun .github/scripts/dist-smoke.ts

  e2e:
    if: >-
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Playwright version
        id: playwright
        working-directory: examples
        run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: examples
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: examples
        run: bunx playwright install-deps chromium

      - name: Specs on React and dom
        working-directory: examples
        run: bun run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: examples/test-results
          retention-days: 7

  hot:
    if: >-
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Hot reload in Chrome
        env:
          CHROME: /usr/bin/google-chrome
        run: bun .github/scripts/hot-probe.ts

  native:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'react-native') && (
        github.event.pull_request.stack == null ||
        github.event.pull_request.stack.position == github.event.pull_request.stack.size
      )
    uses: ./.github/workflows/native.yml
