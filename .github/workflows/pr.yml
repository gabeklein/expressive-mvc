name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - run: bun run test

      - run: bun run build

      - name: Dist is consumable
        run: bun .github/scripts/dist-check.ts

      - name: Bundle size
        continue-on-error: true
        run: bun .github/scripts/size-limit.ts

      - name: Docs agree with code
        run: bun .github/scripts/docs-check.ts

      - name: Changeset reminder
        continue-on-error: true
        run: bunx changeset status --since origin/main

      - name: Pack validation
        continue-on-error: true
        run: |
          for pkg in mvc react router; do
            (cd packages/$pkg && npm publish --dry-run)
          done

  dist-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: dist-smoke-npm-${{ runner.os }}-${{ hashFiles('package.json', 'packages/*/package.json') }}
          restore-keys: dist-smoke-npm-${{ runner.os }}-

      - run: bun run build

      - name: Packed tarballs install and run
        run: bun .github/scripts/dist-smoke.ts
